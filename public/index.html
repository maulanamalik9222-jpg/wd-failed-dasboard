<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>WD Failed Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">OPERATIONS</div>
      <h1>WD Failed Dashboard</h1>
    </div>
    <button id="logoutBtn" class="ghost hidden">Keluar</button>
  </header>

  <main class="container">
    <section id="loginCard" class="card login-card">
      <h2>Akses Staff</h2>
      <p>Masukkan Staff API Key untuk membuka dashboard.</p>
      <input id="apiKey" type="password" placeholder="Staff API Key" autocomplete="off">
      <button id="loginBtn" class="primary">Masuk</button>
      <div id="loginMsg" class="msg"></div>
    </section>

    <section id="app" class="hidden">
      <div class="stats" id="stats"></div>

      <section class="card">
        <div class="section-head">
          <div>
            <h2>Import WD Failed</h2>
            <p>Copy tabel dari sistem lalu paste di bawah. Tidak perlu input satu-satu.</p>
          </div>
        </div>
        <textarea id="importText" rows="6" placeholder="Paste tabel WD di sini..."></textarea>
        <div class="row gap">
          <button id="importBtn" class="primary">Import Data</button>
          <button id="clearImportBtn" class="secondary">Bersihkan</button>
        </div>
        <div id="importMsg" class="msg"></div>
      </section>

      <section class="card">
        <div class="toolbar">
          <input id="search" placeholder="Cari nomor rekening..." inputmode="text">
          <select id="statusFilter">
            <option value="">Semua Status</option>
            <option value="FAILED">FAILED</option>
            <option value="DIPROSES">DIPROSES</option>
            <option value="CAIR">CAIR</option>
            <option value="REFUND">REFUND</option>
            <option value="CANCEL">CANCEL</option>
          </select>
          <button id="refreshBtn" class="secondary">Refresh</button>
        </div>
        <div id="tableWrap" class="table-wrap"></div>
      </section>
    </section>
  </main>

  <dialog id="detailDialog">
    <form method="dialog" class="dialog-card">
      <button class="close" value="cancel">×</button>
      <div id="detail"></div>
    </form>
  </dialog>

  <script src="/app.js" defer></script>
</body>
</html>
